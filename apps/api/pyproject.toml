[project]
name = "clinexa-api"
version = "0.1.0"
description = "Clinexa — agentic primary-care voice assistant (API + real-time voice pipeline)"
authors = [{ name = "RoopakBRK", email = "roopak2804@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "websockets>=14.0",
    "twilio>=9.3",
    "structlog>=24.4",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "anthropic>=0.60",
    "qdrant-client>=1.15",
    "sentence-transformers>=5.0",
    "bm25s>=0.2",
    "pystemmer>=2.2",
    "pymupdf>=1.26",
    "pymupdf4llm>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "logfire[asyncpg,fastapi,httpx,redis,sqlalchemy]>=4.0",
    "tenacity>=9.0",
    "httpx>=0.28",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx2",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:audioop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
# Line length is owned by `ruff format`; E501 only flags lines it cannot split.
# RUF001-3: ingestion deliberately handles the en dashes / bullets / ligatures found in the PDFs.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["twilio.*", "pymupdf4llm.*", "pymupdf.*", "fitz.*"]
ignore_missing_imports = true
